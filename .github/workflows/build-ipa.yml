name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select available iPhone Simulator
        id: sim
        run: |
          SIM_ID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in sorted(data.get("devices", {}).items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      print(d["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          PY
          )
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ByteReaper.xcodeproj \
            -scheme ByteReaper \
            -destination "id=$SIM_ID" 2>&1 | tee build-test.log || {
              echo "::error::xcodebuild test failed"
              grep -nE "error:|fatal error:|failed" build-test.log | tail -n 40 || true
              exit 1
            }

      - name: Archive Release app for iphoneos
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ByteReaper.xcodeproj \
            -scheme ByteReaper \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ByteReaper.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee build-archive.log || {
              echo "::error::xcodebuild archive failed"
              grep -nE "error:|fatal error:" build-archive.log | tail -n 40 || true
              exit 1
            }

      - name: Package IPA and verify arm64 Mach-O binary
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ByteReaper.xcarchive/Products/Applications/ByteReaper.app build/ipa/Payload/
          file build/ipa/Payload/ByteReaper.app/ByteReaper | grep -q "arm64"
          cd build/ipa
          zip -qry ../ByteReaper-unsigned.ipa Payload
          ls -lh ../ByteReaper-unsigned.ipa

      - name: Upload ByteReaper-unsigned.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByteReaper-unsigned-ipa
          path: build/ByteReaper-unsigned.ipa
          if-no-files-found: error

      - name: Upload failure logs if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-test.log
            build-archive.log
          if-no-files-found: ignore

